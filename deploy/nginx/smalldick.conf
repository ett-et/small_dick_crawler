# smalldick.etbiss.com — 由共用 etchai_nginx 反向代理
#
# 部署位置：複製到 VPS /opt/etchai/nginx/conf.d/smalldick.conf（etchai_nginx 掛載此目錄）。
# 版控留底在本 repo deploy/nginx/（慣例同 lifetool：conf 跟著自己的服務走，不進 etchai repo）。
#
# upstream 用 IP 字面值 172.17.0.1:2000（docker0 gateway），⛔ 不用容器名。
#   理由（plan D7 v3）：nginx 對字面 hostname 在 config parse 時解析，
#   smalldick_web 沒起會讓 etchai_nginx 啟動失敗 → 弄掛另外三個租戶。
#   IP 字面值不需解析 → 本服務掛掉最多是 502，不會擴散。
#
# 首次簽證 chicken-egg：先放 smalldick-temp.conf（僅 HTTP + ACME）簽完 cert
# 再放本檔 + reload。

upstream smalldick {
    server 172.17.0.1:2000;
}

# HTTP：ACME 驗證 + 轉 HTTPS
server {
    listen 80;
    server_name smalldick.etbiss.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name smalldick.etbiss.com;

    ssl_certificate /etc/letsencrypt/live/smalldick.etbiss.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smalldick.etbiss.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 續簽保險（plan D6 / self-review r1 #5）：
    # 若 Cloudflare zone 開了 Always Use HTTPS，:80 的 challenge 會被 301 到 https
    # 而落進 app → renew 靜默失敗。這裡也放一份，成本近零。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://smalldick;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
