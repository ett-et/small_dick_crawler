# smalldick.etbiss.com — 首次簽證用（僅 HTTP + ACME challenge）
#
# 為什麼要有這一份：正式的 smalldick.conf 有 :443 block，會引用還不存在的憑證檔
# → nginx -t 失敗 → reload 失敗 → 連帶弄掛同一個 nginx 上的 etchai / lifetool / ymetc。
# 故首次部署先放本檔簽完 cert，再換上 smalldick.conf。
# （同 lifetool 的 lifetool-temp.conf 慣例。）
#
# 部署：scp 到 VPS /opt/etchai/nginx/conf.d/smalldick.conf
#       docker exec etchai_nginx nginx -t && docker exec etchai_nginx nginx -s reload

server {
    listen 80;
    server_name smalldick.etbiss.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "smalldick: awaiting certificate\n";
        add_header Content-Type text/plain;
    }
}
